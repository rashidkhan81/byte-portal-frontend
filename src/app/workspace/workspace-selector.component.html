<main class="selector-page"><div class="selector-card"><a class="brand" routerLink="/"><span class="brand-mark">B</span><span>byte<span>portal</span></span></a><p class="kicker">Choose your workspace</p><h1>Where would you like to start?</h1><p class="intro">{{ user?.name || 'Your account' }} has access to more than one BytePortal workspace.</p><div class="workspace-options"><button type="button" *ngFor="let role of roles" (click)="continueAs(role)"><span class="option-icon">{{ role === 'JOB_SEEKER' ? 'S' : role === 'JOB_PROVIDER' ? 'P' : 'A' }}</span><span><strong>{{ role === 'JOB_SEEKER' ? 'Job Seeker' : role === 'JOB_PROVIDER' ? 'Employer' : 'Admin' }}</strong><small>Continue to your {{ role === 'JOB_SEEKER' ? 'career' : role === 'JOB_PROVIDER' ? 'hiring' : 'administration' }} workspace</small></span><span class="arrow">&#8594;</span></button></div></div></main>
