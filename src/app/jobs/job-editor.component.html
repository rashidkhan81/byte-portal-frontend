<main class="editor-page"><header class="editor-header"><a class="brand" routerLink="/"><span class="brand-mark">B</span><span>byte<span>portal</span></span></a><a routerLink="/provider/jobs">My jobs</a></header><section class="editor-content"><p class="kicker">Provider workspace</p><h1>{{ jobId ? 'Edit this role.' : 'Post a new role.' }}</h1><p class="intro">Give the right people enough context to imagine themselves here.</p><form (ngSubmit)="save()"><label>Job title<input name="title" [(ngModel)]="title" required placeholder="e.g. Senior Java Developer"></label><label>Description<textarea name="description" [(ngModel)]="description" rows="6" placeholder="Describe the work, team, and opportunity"></textarea></label><div class="two-columns"><label>Location<input name="location" [(ngModel)]="location" placeholder="Remote, London, etc."></label><label>Salary<input name="salary" type="number" min="1" [(ngModel)]="salary" placeholder="Annual salary"></label></div><div class="two-columns"><label>Employment type<select name="employmentType" [(ngModel)]="employmentType"><option *ngFor="let type of employmentTypes" [value]="type">{{ type }}</option></select></label><label>Status<select name="status" [(ngModel)]="status"><option *ngFor="let option of statuses" [value]="option">{{ option }}</option></select></label></div><p class="error" *ngIf="errorMessage">{{ errorMessage }}</p><p class="success" *ngIf="successMessage">{{ successMessage }}</p><div class="actions"><button class="save" type="submit" [disabled]="isSaving">{{ isSaving ? 'Saving...' : jobId ? 'Save changes' : 'Create job' }} <span>&#8594;</span></button><button class="delete" *ngIf="jobId" type="button" (click)="delete()">Delete job</button></div></form></section></main>
